*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:Orbitron,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}

button:active{background:#1d3670;transform:scale(.97)}
button:focus-visible{outline:2px solid #fff}
.ib{min-height:34px;width:38px;font-size:14px;border-radius:10px;padding:0}
#controls{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:12px;padding:0 18px}
@media(pointer:fine){#controls{display:none}}
#modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:#04051199}
.panel{max-height:90vh;overflow-y:auto;width:min(400px,100%);padding:24px 20px;text-align:center;border:1px solid #6a43d9;border-radius:20px;background:linear-gradient(150deg,#101735f2,#080a1af2);box-shadow:0 0 40px #733dff55}
h1{font-size:clamp(34px,11vw,52px);line-height:.95;margin:0 0 10px;color:var(--cy);text-shadow:0 0 22px #00cfff;font-weight:800}
p{color:#cbd3ff;line-height:1.5;margin:10px 0;font-size:13px;font-family:system-ui,sans-serif}
.panel button{max-width:none;width:100%;margin-top:8px;font-size:15px;background:#17245a}
.row{display:flex;gap:8px}.row button{margin-top:8px}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;font:600 12px Orbitron,system-ui;text-align:left}
input[type=range]{width:50%;accent-color:#37eaff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.grid button{min-height:64px;font-size:18px;margin:0;padding:4px}.grid small{display:block;font-size:7px;color:#8f9bd6;margin-top:3px}
#yt{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:5;display:none;padding:9px 12px;border-radius:12px;background:#c4111dee;color:#fff;font:700 11px Orbitron,system-ui,sans-serif;text-decoration:none;box-shadow:0 0 18px #ff2b3a66}
